<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">每個外部 side effect 都先向 execution budget 取得預留</title><desc id="desc">Planner 提出 operation，ledger 先做穩定身分去重與預算預留，再允許或阻擋外部 side effect，最後記錄結果。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5eead4"/></marker><style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.t{fill:#f8fafc;font-size:34px;font-weight:700}.s{fill:#94a3b8;font-size:20px}.b{fill:#13233d;stroke:#5eead4;stroke-width:2}.h{fill:#e2e8f0;font-size:22px;font-weight:650}.d{fill:#94a3b8;font-size:18px}.l{stroke:#5eead4;stroke-width:3;marker-end:url(#a)}</style></defs>
  <style>.l,path[stroke="#f87171"]{fill:none}</style><rect width="1200" height="675" rx="28" fill="#08111f"/><text x="72" y="78" class="t">Budget 必須早於 Side Effect</text><text x="72" y="112" class="s">事後 log 只能看見超支；pre-side-effect reservation 才能阻止超支。</text>
  <g transform="translate(55 240)"><rect class="b" width="185" height="120" rx="20"/><text class="h" x="92" y="48" text-anchor="middle">Planner</text><text class="d" x="92" y="80" text-anchor="middle">提出 operation</text></g><path class="l" d="M240 300h85"/>
  <g transform="translate(325 210)"><rect width="270" height="180" rx="22" fill="#143127" stroke="#fbbf24" stroke-width="2"/><text class="h" x="135" y="48" text-anchor="middle">Execution Ledger</text><text class="d" x="135" y="90" text-anchor="middle">穩定身分去重</text><text class="d" x="135" y="122" text-anchor="middle">reserve budget</text><text class="d" x="135" y="154" text-anchor="middle">typed reason</text></g>
  <path class="l" d="M595 300h100"/><g transform="translate(695 210)"><rect class="b" width="205" height="120" rx="20"/><text class="h" x="102" y="46" text-anchor="middle">ALLOWED</text><text class="d" x="102" y="80" text-anchor="middle">執行外部工作</text></g><path class="l" d="M900 270h100"/>
  <g transform="translate(1000 210)"><rect class="b" width="150" height="120" rx="20"/><text class="h" x="75" y="46" text-anchor="middle">Result</text><text class="d" x="75" y="80" text-anchor="middle">記錄 outcome</text></g>
  <path d="M460 390v90h235" stroke="#f87171" stroke-width="3" marker-end="url(#a)"/><g transform="translate(695 430)"><rect width="300" height="110" rx="20" fill="#341d2a" stroke="#f87171" stroke-width="2"/><text class="h" x="150" y="45" text-anchor="middle">BLOCKED_BY_BUDGET</text><text class="d" x="150" y="76" text-anchor="middle">不執行；下游保持 UNKNOWN</text></g>
  <text x="72" y="610" class="s">query · provider · retry · redirect · resolver · materialization · fallback</text>
</svg>
