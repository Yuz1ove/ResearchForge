<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Study Facts 的四種狀態與下游寫作權限</title><desc id="desc">PRESENT、NOT_REPORTED、UNKNOWN 與 NOT_APPLICABLE 保留不同語義，只有 PRESENT 帶有可使用的值。</desc>
  <defs><style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.t{fill:#f8fafc;font-size:34px;font-weight:700}.s{fill:#94a3b8;font-size:20px}.b{fill:#13233d;stroke-width:2}.h{fill:#e2e8f0;font-size:23px;font-weight:700}.d{fill:#94a3b8;font-size:18px}.ok{stroke:#5eead4}.warn{stroke:#fbbf24}.stop{stroke:#f87171}.na{stroke:#a78bfa}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#08111f"/><text x="72" y="78" class="t">缺失也需要有型別</text><text x="72" y="112" class="s">空值若沒有狀態，Writer 可能把觀測缺口寫成研究結論。</text>
  <g transform="translate(60 205)"><rect class="b ok" width="255" height="230" rx="22"/><text class="h" x="128" y="52" text-anchor="middle">PRESENT</text><text class="d" x="128" y="98" text-anchor="middle">有 value</text><text class="d" x="128" y="130" text-anchor="middle">有 locator</text><text x="128" y="184" text-anchor="middle" fill="#5eead4" font-size="20">可依限制使用</text></g>
  <g transform="translate(335 205)"><rect class="b warn" width="255" height="230" rx="22"/><text class="h" x="128" y="52" text-anchor="middle">NOT_REPORTED</text><text class="d" x="128" y="98" text-anchor="middle">材料足以檢查</text><text class="d" x="128" y="130" text-anchor="middle">研究未報告</text><text x="128" y="184" text-anchor="middle" fill="#fbbf24" font-size="20">不能補值</text></g>
  <g transform="translate(610 205)"><rect class="b stop" width="255" height="230" rx="22"/><text class="h" x="128" y="52" text-anchor="middle">UNKNOWN</text><text class="d" x="128" y="98" text-anchor="middle">觀測不足</text><text class="d" x="128" y="130" text-anchor="middle">尚未知道</text><text x="128" y="184" text-anchor="middle" fill="#fca5a5" font-size="20">不能變成零</text></g>
  <g transform="translate(885 205)"><rect class="b na" width="255" height="230" rx="22"/><text class="h" x="128" y="52" text-anchor="middle">NOT_APPLICABLE</text><text class="d" x="128" y="98" text-anchor="middle">研究設計不適用</text><text class="d" x="128" y="130" text-anchor="middle">保留 reason</text><text x="128" y="184" text-anchor="middle" fill="#c4b5fd" font-size="20">不可比較</text></g>
  <text x="72" y="560" class="s">UNKNOWN ≠ NOT_REPORTED ≠ 0 ≠ false</text><text x="72" y="600" class="s">狀態、定位與 provenance 必須一起進入下游。</text>
</svg>
