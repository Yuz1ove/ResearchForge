<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">從合法 route 到 qualifying full text 的分層漏斗</title><desc id="desc">合法 route、payload fetch、artifact materialization、identity match 與 scholarly structure qualification 逐層檢查，任何一層都可停止。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5eead4"/></marker><style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.t{fill:#f8fafc;font-size:34px;font-weight:700}.s{fill:#94a3b8;font-size:20px}.h{fill:#e2e8f0;font-size:22px;font-weight:650}.d{fill:#94a3b8;font-size:17px}.l{stroke:#5eead4;stroke-width:3;marker-end:url(#a)}.stop{fill:#fca5a5;font-size:16px}</style></defs>
  <style>.l{fill:none}</style><rect width="1200" height="675" rx="28" fill="#08111f"/><text x="72" y="78" class="t">HTTP 200 不是全文</text><text x="72" y="112" class="s">成功單位必須一路對準下游真正需要的 artifact。</text>
  <g transform="translate(70 220)"><path d="M0 0h190l-25 105H25z" fill="#13233d" stroke="#5eead4" stroke-width="2"/><text class="h" x="95" y="45" text-anchor="middle">Legal route</text><text class="d" x="95" y="75" text-anchor="middle">允許嘗試</text></g>
  <g transform="translate(285 220)"><path d="M0 0h190l-25 105H25z" fill="#13233d" stroke="#5eead4" stroke-width="2"/><text class="h" x="95" y="45" text-anchor="middle">Payload</text><text class="d" x="95" y="75" text-anchor="middle">bytes / MIME</text></g>
  <g transform="translate(500 220)"><path d="M0 0h190l-25 105H25z" fill="#13233d" stroke="#5eead4" stroke-width="2"/><text class="h" x="95" y="45" text-anchor="middle">Artifact</text><text class="d" x="95" y="75" text-anchor="middle">可解析文件</text></g>
  <g transform="translate(715 220)"><path d="M0 0h190l-25 105H25z" fill="#13233d" stroke="#5eead4" stroke-width="2"/><text class="h" x="95" y="45" text-anchor="middle">Identity</text><text class="d" x="95" y="75" text-anchor="middle">正確研究</text></g>
  <g transform="translate(930 220)"><path d="M0 0h190l-25 105H25z" fill="#143127" stroke="#fbbf24" stroke-width="2"/><text class="h" x="95" y="45" text-anchor="middle">Structure</text><text class="d" x="95" y="75" text-anchor="middle">實質 scholarly body</text></g>
  <path class="l" d="M235 272h42M450 272h42M665 272h42M880 272h42"/>
  <path d="M165 325v95M380 325v95M595 325v95M810 325v95" stroke="#f87171" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="165" y="452" text-anchor="middle" class="stop">blocked / unavailable</text><text x="380" y="452" text-anchor="middle" class="stop">landing / abstract</text><text x="595" y="452" text-anchor="middle" class="stop">wrong format</text><text x="810" y="452" text-anchor="middle" class="stop">wrong work</text>
  <path class="l" d="M1025 325v100"/><g transform="translate(865 425)"><rect width="320" height="95" rx="20" fill="#143127" stroke="#fbbf24" stroke-width="2"/><text class="h" x="160" y="42" text-anchor="middle">Qualifying Full Text</text><text class="d" x="160" y="70" text-anchor="middle">才能進入 facts / admission</text></g>
  <text x="72" y="610" class="s">Metadata success ≠ payload ≠ artifact ≠ qualifying full text</text>
</svg>
