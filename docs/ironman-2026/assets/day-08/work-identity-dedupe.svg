<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">多個 provider records 如何收斂成 scholarly work identity</title><desc id="desc">三個來源記錄先保留各自 provenance，再依 DOI 或作者年份標題等訊號收斂到研究作品身分；弱訊號只建立可能匹配。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5eead4"/></marker><style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.t{fill:#f8fafc;font-size:34px;font-weight:700}.s{fill:#94a3b8;font-size:20px}.b{fill:#13233d;stroke:#5eead4;stroke-width:2}.h{fill:#e2e8f0;font-size:22px;font-weight:650}.d{fill:#94a3b8;font-size:17px}.l{stroke:#5eead4;stroke-width:3;marker-end:url(#a)}</style></defs>
  <style>.l{fill:none}</style><rect width="1200" height="675" rx="28" fill="#08111f"/><text x="72" y="78" class="t">去重是 Identity Resolution</text><text x="72" y="112" class="s">合併 description，不刪除 provider provenance。</text>
  <g transform="translate(70 190)"><rect class="b" width="210" height="90" rx="18"/><text class="h" x="105" y="40" text-anchor="middle">OpenAlex record</text><text class="d" x="105" y="66" text-anchor="middle">title · ID · metadata</text></g>
  <g transform="translate(70 310)"><rect class="b" width="210" height="90" rx="18"/><text class="h" x="105" y="40" text-anchor="middle">Crossref record</text><text class="d" x="105" y="66" text-anchor="middle">DOI · authors · year</text></g>
  <g transform="translate(70 430)"><rect class="b" width="210" height="90" rx="18"/><text class="h" x="105" y="40" text-anchor="middle">S2 record</text><text class="d" x="105" y="66" text-anchor="middle">provider ID · abstract</text></g>
  <path class="l" d="M280 235h185M280 355h185M280 475h185"/>
  <g transform="translate(465 235)"><rect width="260" height="240" rx="22" fill="#143127" stroke="#fbbf24" stroke-width="2"/><text x="130" y="50" text-anchor="middle" class="h">Identity signals</text><text x="130" y="92" text-anchor="middle" class="d">1. exact DOI / stable ID</text><text x="130" y="127" text-anchor="middle" class="d">2. cross-reference</text><text x="130" y="162" text-anchor="middle" class="d">3. title + author + year</text><text x="130" y="205" text-anchor="middle" fill="#fbbf24" font-size="17">弱訊號 → possible match</text></g>
  <path class="l" d="M725 355h150"/><g transform="translate(875 260)"><rect class="b" width="255" height="190" rx="22"/><text x="127" y="52" text-anchor="middle" class="h">Scholarly Work</text><text x="127" y="90" text-anchor="middle" class="d">canonical fields</text><text x="127" y="122" text-anchor="middle" class="d">provider lineage</text><text x="127" y="154" text-anchor="middle" class="d">merge reason</text></g>
  <text x="72" y="610" class="s">Source records ≠ unique works ≠ evidence facts</text>
</svg>
