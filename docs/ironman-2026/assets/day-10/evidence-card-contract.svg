<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Evidence Card 把來源轉成可追溯的寫作材料</title><desc id="desc">被接受來源中的主張、引用身分、定位與限制一起進入 Evidence Card，再以受限投影交給 Writer。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5eead4"/></marker><style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.t{fill:#f8fafc;font-size:34px;font-weight:700}.s{fill:#94a3b8;font-size:20px}.b{fill:#13233d;stroke:#5eead4;stroke-width:2}.h{fill:#e2e8f0;font-size:23px;font-weight:650}.d{fill:#94a3b8;font-size:18px}.l{stroke:#5eead4;stroke-width:3;marker-end:url(#a)}</style></defs>
  <style>.l{fill:none}</style><rect width="1200" height="675" rx="28" fill="#08111f"/><text x="72" y="78" class="t">Evidence Card 不是摘要卡</text><text x="72" y="112" class="s">它保存支持關係，不能創造來源裡沒有的事實。</text>
  <g transform="translate(70 240)"><rect class="b" width="250" height="150" rx="22"/><text x="125" y="48" text-anchor="middle" class="h">Accepted Source</text><text x="125" y="86" text-anchor="middle" class="d">來源身分</text><text x="125" y="116" text-anchor="middle" class="d">可檢查材料</text></g>
  <path class="l" d="M320 315h110"/><g transform="translate(430 180)"><rect width="350" height="270" rx="24" fill="#143127" stroke="#fbbf24" stroke-width="2"/><text x="175" y="52" text-anchor="middle" class="h">Evidence Card</text><text x="50" y="100" class="d">• claim：可以檢查的窄主張</text><text x="50" y="140" class="d">• citation：來源身分</text><text x="50" y="180" class="d">• locator：回到材料的位置</text><text x="50" y="220" class="d">• limitation：不能越過的範圍</text></g>
  <path class="l" d="M780 315h105"/><g transform="translate(885 240)"><rect class="b" width="245" height="150" rx="22"/><text x="122" y="48" text-anchor="middle" class="h">Writer 投影</text><text x="122" y="86" text-anchor="middle" class="d">只讀受限材料</text><text x="122" y="116" text-anchor="middle" fill="#fbbf24" font-size="18">不得提高主張強度</text></g>
  <text x="72" y="590" class="s">摘要回答「這篇在談什麼」；Evidence Card 回答「哪個主張由哪裡支持」。</text>
</svg>
