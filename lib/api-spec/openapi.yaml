openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sources
    description: Source retrieval operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /search-sources:
    post:
      operationId: searchSources
      tags: [sources]
      summary: Search sources
      description: Searches OpenAlex, Semantic Scholar, and Crossref for academic/web sources related to a research topic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchSourcesRequest"
      responses:
        "200":
          description: Source search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSearchResult"
        "400":
          description: Invalid search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Source provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Source provider timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search-keywords:
    post:
      operationId: searchKeywords
      tags: [sources]
      summary: Expand source-search keywords and search providers
      description: Generates LLM-assisted or deterministic fallback search keywords, then searches source providers grouped by query and provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchKeywordsRequest"
      responses:
        "200":
          description: Keyword expansion and grouped source search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordSourceSearchResult"
        "400":
          description: Invalid keyword search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SearchSourcesRequest:
      type: object
      description: Provide either `query` for direct keyword search or `topic` with generator context.
      properties:
        query:
          type: string
          minLength: 1
        topic:
          type: string
          minLength: 1
        reportType:
          type: string
        audience:
          type: string
        sourceMode:
          type: string
        language:
          type: string
    SearchKeywordsRequest:
      type: object
      properties:
        topic:
          type: string
          minLength: 1
        reportType:
          type: string
        audience:
          type: string
        sourceMode:
          type: string
        language:
          type: string
      required:
        - topic
    SourceReviewState:
      type: string
      enum:
        - pending
        - accepted
        - rejected
    SourceRecord:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        year:
          type: integer
          nullable: true
        abstract:
          type: string
          nullable: true
        doi:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        sourceType:
          type: string
          enum:
            - OpenAlex
            - Crossref
            - Semantic Scholar
        reviewState:
          $ref: "#/components/schemas/SourceReviewState"
        publisher:
          type: string
          nullable: true
        containerTitle:
          type: string
          nullable: true
        accessedAt:
          type: string
          nullable: true
        relevanceLevel:
          type: string
          nullable: true
          enum:
            - primary
            - secondary
            - clue
            - low
            - off_topic
        relevanceScore:
          type: number
          nullable: true
        relevanceReasons:
          type: array
          nullable: true
          items:
            type: string
        matchedCoreConcepts:
          type: array
          nullable: true
          items:
            type: string
        missingCoreConcepts:
          type: array
          nullable: true
          items:
            type: string
        matchedFacets:
          type: array
          nullable: true
          items:
            type: string
        missingRequiredFacets:
          type: array
          nullable: true
          items:
            type: string
        evidenceGrounding:
          type: string
          nullable: true
          enum:
            - abstract_grounded
            - snippet_grounded
            - metadata_only
            - insufficient
        sourceRelevanceReasonZhTw:
          type: string
          nullable: true
        shouldShowInMainList:
          type: boolean
          nullable: true
        shouldRecommendAccept:
          type: boolean
          nullable: true
      required:
        - id
        - title
        - authors
        - year
        - abstract
        - doi
        - url
        - sourceType
        - reviewState
        - publisher
        - containerTitle
        - accessedAt
    SourceSearchResult:
      type: object
      properties:
        ok:
          type: boolean
        topic:
          type: string
        searchIntent:
          $ref: "#/components/schemas/SearchIntentSummary"
        queries:
          $ref: "#/components/schemas/SearchIntentQuerySet"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        provider_status:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
        warnings:
          type: array
          items:
            type: string
        llm_status:
          type: string
          enum:
            - success
            - timeout
            - quota_exceeded
            - failed
            - skipped
        keyword_expansion:
          $ref: "#/components/schemas/KeywordExpansionResult"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        planner:
          $ref: "#/components/schemas/SearchIntentPlan"
        relevance_debug:
          type: array
          items:
            $ref: "#/components/schemas/SearchRelevanceDebug"
      required:
        - sources
    KeywordExpansionResult:
      type: object
      properties:
        normalized_topic:
          type: string
        domains:
          type: array
          items:
            type: string
        search_queries:
          type: array
          items:
            type: string
        english_queries:
          type: array
          items:
            type: string
        chinese_queries:
          type: array
          items:
            type: string
        preferred_source_types:
          type: array
          items:
            type: string
        avoid_source_types:
          type: array
          items:
            type: string
        reasoning_notes:
          type: array
          items:
            type: string
        fallback_used:
          type: boolean
        llm_status:
          type: string
          enum:
            - success
            - timeout
            - quota_exceeded
            - failed
            - skipped
      required:
        - normalized_topic
        - domains
        - search_queries
        - english_queries
        - chinese_queries
        - preferred_source_types
        - avoid_source_types
        - reasoning_notes
        - fallback_used
        - llm_status
    SearchIntentSummary:
      type: object
      properties:
        primaryConcepts:
          type: array
          items:
            type: string
        contextConcepts:
          type: array
          items:
            type: string
        outcomeConcepts:
          type: array
          items:
            type: string
        populationConcepts:
          type: array
          items:
            type: string
        lowWeightTerms:
          type: array
          items:
            type: string
        mustHaveTerms:
          type: array
          items:
            type: string
        plannerStatus:
          type: string
          enum:
            - llm
            - rule_fallback
            - skipped
            - failed
        fallbackUsed:
          type: boolean
      required:
        - primaryConcepts
        - contextConcepts
        - outcomeConcepts
        - populationConcepts
        - lowWeightTerms
        - mustHaveTerms
        - plannerStatus
        - fallbackUsed
    SearchIntentQuerySet:
      type: object
      properties:
        chinese:
          type: array
          items:
            type: string
        english:
          type: array
          items:
            type: string
        highPrecision:
          type: array
          items:
            type: string
        broad:
          type: array
          items:
            type: string
      required:
        - chinese
        - english
        - highPrecision
        - broad
    SearchIntentSourceSearchResult:
      type: object
      properties:
        ok:
          type: boolean
        topic:
          type: string
        searchIntent:
          $ref: "#/components/schemas/SearchIntentSummary"
        queries:
          $ref: "#/components/schemas/SearchIntentQuerySet"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        provider_status:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
        warnings:
          type: array
          items:
            type: string
        planner:
          $ref: "#/components/schemas/SearchIntentPlan"
        relevance_debug:
          type: array
          items:
            $ref: "#/components/schemas/SearchRelevanceDebug"
        llm_status:
          type: string
          enum:
            - success
            - timeout
            - quota_exceeded
            - failed
            - skipped
        keyword_expansion:
          $ref: "#/components/schemas/KeywordExpansionResult"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
      required:
        - ok
        - topic
        - searchIntent
        - queries
        - results
        - sources
        - provider_status
        - warnings
        - planner
        - llm_status
        - keyword_expansion
        - groups
    SearchIntentPlan:
      type: object
      properties:
        normalizedTopic:
          type: string
        primaryConcepts:
          type: array
          items:
            type: string
        contextConcepts:
          type: array
          items:
            type: string
        outcomeConcepts:
          type: array
          items:
            type: string
        populationConcepts:
          type: array
          items:
            type: string
        lowWeightTerms:
          type: array
          items:
            type: string
        mustHaveTerms:
          type: array
          items:
            type: string
        shouldHaveTerms:
          type: array
          items:
            type: string
        penaltyTerms:
          type: array
          items:
            type: string
        negativeTerms:
          type: array
          items:
            type: string
        chineseQueries:
          type: array
          items:
            type: string
        englishQueries:
          type: array
          items:
            type: string
        reasoningNotes:
          type: array
          items:
            type: string
        plannerStatus:
          type: string
          enum:
            - llm
            - rule_fallback
            - skipped
            - failed
        fallbackUsed:
          type: boolean
      required:
        - normalizedTopic
        - primaryConcepts
        - contextConcepts
        - outcomeConcepts
        - populationConcepts
        - lowWeightTerms
        - mustHaveTerms
        - shouldHaveTerms
        - penaltyTerms
        - negativeTerms
        - chineseQueries
        - englishQueries
        - reasoningNotes
        - plannerStatus
        - fallbackUsed
    SearchRelevanceDebug:
      type: object
      properties:
        sourceId:
          type: string
        title:
          type: string
        score:
          type: number
        matchedPrimaryConcepts:
          type: array
          items:
            type: string
        matchedMustHaveTerms:
          type: array
          items:
            type: string
        matchedContextConcepts:
          type: array
          items:
            type: string
        matchedOutcomeConcepts:
          type: array
          items:
            type: string
        penalties:
          type: array
          items:
            type: string
      required:
        - sourceId
        - title
        - score
        - matchedPrimaryConcepts
        - matchedMustHaveTerms
        - matchedContextConcepts
        - matchedOutcomeConcepts
        - penalties
    KeywordSourceGroup:
      type: object
      properties:
        ok:
          type: boolean
        provider:
          type: string
          enum:
            - OpenAlex
            - Crossref
            - Semantic Scholar
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        error_type:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
      required:
        - ok
        - provider
        - query
        - results
        - error_type
        - error_message
    KeywordSourceSearchResult:
      type: object
      properties:
        ok:
          type: boolean
        llm_status:
          type: string
          enum:
            - success
            - timeout
            - quota_exceeded
            - failed
            - skipped
        keyword_expansion:
          $ref: "#/components/schemas/KeywordExpansionResult"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
      required:
        - ok
        - llm_status
        - keyword_expansion
        - groups
        - sources
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
