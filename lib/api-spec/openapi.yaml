openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sources
    description: Source retrieval operations
  - name: topics
    description: Topic understanding operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /search-sources:
    post:
      operationId: searchSources
      tags: [sources]
      summary: Search sources
      description: Searches OpenAlex, Semantic Scholar, and Crossref for academic/web sources related to a research topic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchSourcesRequest"
      responses:
        "200":
          description: Source search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSearchResult"
        "400":
          description: Invalid search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Source provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Source provider timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search-keywords:
    post:
      operationId: searchKeywords
      tags: [sources]
      summary: Expand source-search keywords and search providers
      description: Generates LLM-assisted or deterministic fallback search keywords, then searches source providers grouped by query and provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchKeywordsRequest"
      responses:
        "200":
          description: Keyword expansion and grouped source search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordSourceSearchResult"
        "400":
          description: Invalid keyword search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /topic-understanding:
    post:
      operationId: topicUnderstanding
      tags: [topics]
      summary: Understand a research topic
      description: Expands a topic into structured research angles with deterministic fallback when local LLM is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUnderstandingRequest"
      responses:
        "200":
          description: Topic understanding result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicUnderstandingResult"
        "400":
          description: Invalid topic request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Topic understanding failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SearchSourcesRequest:
      type: object
      description: Provide either `query` for direct keyword search or `topic` with generator context.
      properties:
        query:
          type: string
          minLength: 1
        topic:
          type: string
          minLength: 1
        originalTopic:
          type: string
        activeResearchTopic:
          type: string
        refinedTopic:
          type: string
        displayTitle:
          type: string
        canonicalTopicZh:
          type: string
        canonicalTopicEn:
          type: string
        querySeedZh:
          type: array
          items:
            type: string
        querySeedEn:
          type: array
          items:
            type: string
        subtopics:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              titleZh:
                type: string
              titleEn:
                type: string
              queryZh:
                type: array
                items:
                  type: string
              queryEn:
                type: array
                items:
                  type: string
              mustIncludeTerms:
                type: array
                items:
                  type: string
              excludeTerms:
                type: array
                items:
                  type: string
              expectedSourceTypes:
                type: array
                items:
                  type: string
        mustIncludeTerms:
          type: array
          items:
            type: string
        excludeTerms:
          type: array
          items:
            type: string
        domainHints:
          type: array
          items:
            type: string
        selectedResearchPlanId:
          type: string
        workflowId:
          type: string
        sourceMixProfile:
          type: string
        searchProfile:
          type: string
          enum: [quick, standard, deep]
        reportType:
          type: string
        audience:
          type: string
        sourceMode:
          type: string
        language:
          type: string
    SearchKeywordsRequest:
      type: object
      properties:
        topic:
          type: string
          minLength: 1
        reportType:
          type: string
        audience:
          type: string
        sourceMode:
          type: string
        language:
          type: string
      required:
        - topic
    TopicUnderstandingRequest:
      type: object
      properties:
        topic:
          type: string
          minLength: 1
        reportType:
          type: string
        audience:
          type: string
        sourceMode:
          type: string
        language:
          type: string
      required:
        - topic
    TopicUnderstandingDiagnostics:
      type: object
      properties:
        usedLocalLlm:
          type: boolean
        fallbackReason:
          type: string
          nullable: true
        confidence:
          type: number
        model:
          type: string
          nullable: true
        latencyMs:
          type: number
          nullable: true
      required:
        - usedLocalLlm
        - confidence
    TopicUnderstandingResult:
      type: object
      properties:
        normalizedTopic:
          type: string
        domain:
          type: string
        subdomain:
          type: string
        entities:
          type: array
          items:
            type: string
        likelyMeanings:
          type: array
          items:
            type: string
        ambiguityWarnings:
          type: array
          items:
            type: string
        researchAngles:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              angle:
                type: string
              reason:
                type: string
              searchQueries:
                type: array
                items:
                  type: string
            required:
              - title
              - angle
              - reason
              - searchQueries
        diagnostics:
          $ref: "#/components/schemas/TopicUnderstandingDiagnostics"
      required:
        - normalizedTopic
        - domain
        - subdomain
        - entities
        - likelyMeanings
        - ambiguityWarnings
        - researchAngles
        - diagnostics
    SourceReviewState:
      type: string
      enum:
        - pending
        - accepted
        - rejected
    SourceRecord:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        year:
          type: integer
          nullable: true
        abstract:
          type: string
          nullable: true
        snippet:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        abstractMissing:
          type: boolean
          nullable: true
        doi:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        sourceType:
          type: string
          enum:
            - OpenAlex
            - Crossref
            - Semantic Scholar
            - Official Source
            - Institutional Source
            - Authoritative Media
        reviewState:
          $ref: "#/components/schemas/SourceReviewState"
        publisher:
          type: string
          nullable: true
        containerTitle:
          type: string
          nullable: true
        accessedAt:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        queryUsed:
          type: string
          nullable: true
        retrievedAt:
          type: string
          nullable: true
        dedupeKey:
          type: string
          nullable: true
        sourceKind:
          type: string
          nullable: true
          enum:
            - journal
            - conference
            - book
            - dataset
            - web
            - unknown
        citationCount:
          type: integer
          nullable: true
        isOpenAccess:
          type: boolean
          nullable: true
        isPeerReviewed:
          type: boolean
          nullable: true
        sourceQualityScore:
          type: number
          nullable: true
        scoreReasons:
          type: array
          nullable: true
          items:
            type: string
        relevanceLevel:
          type: string
          nullable: true
          enum:
            - primary
            - secondary
            - clue
            - low
            - off_topic
        relevanceScore:
          type: number
          nullable: true
        relevanceReasons:
          type: array
          nullable: true
          items:
            type: string
        matchedCoreConcepts:
          type: array
          nullable: true
          items:
            type: string
        missingCoreConcepts:
          type: array
          nullable: true
          items:
            type: string
        matchedFacets:
          type: array
          nullable: true
          items:
            type: string
        missingRequiredFacets:
          type: array
          nullable: true
          items:
            type: string
        evidenceGrounding:
          type: string
          nullable: true
          enum:
            - abstract_grounded
            - snippet_grounded
            - metadata_only
            - insufficient
        sourceRelevanceReasonZhTw:
          type: string
          nullable: true
        shouldShowInMainList:
          type: boolean
          nullable: true
        shouldRecommendAccept:
          type: boolean
          nullable: true
        topicRelevance:
          type: number
          nullable: true
        evidenceQuality:
          type: number
          nullable: true
        metadataCompleteness:
          type: number
          nullable: true
        abstractQuality:
          type: number
          nullable: true
        sourceTrust:
          type: number
          nullable: true
        isMetadataOnly:
          type: boolean
          nullable: true
        isPrimaryEvidence:
          type: boolean
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        recommendation:
          type: string
          nullable: true
      required:
        - id
        - title
        - authors
        - year
        - abstract
        - doi
        - url
        - sourceType
        - reviewState
        - publisher
        - containerTitle
        - accessedAt
    SourceSearchResult:
      type: object
      properties:
        ok:
          type: boolean
        topic:
          type: string
        workflowId:
          type: string
        topicHash:
          type: string
        queryPlanHash:
          type: string
        searchIntent:
          $ref: "#/components/schemas/SearchIntentSummary"
        queries:
          $ref: "#/components/schemas/SearchIntentQuerySet"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        provider_status:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
        warnings:
          type: array
          items:
            type: string
        llm_status:
          type: string
          enum:
            - success
            - timeout
            - quota_exceeded
            - failed
            - skipped
        keyword_expansion:
          $ref: "#/components/schemas/KeywordExpansionResult"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        planner:
          $ref: "#/components/schemas/SearchIntentPlan"
        relevance_debug:
          type: array
          items:
            $ref: "#/components/schemas/SearchRelevanceDebug"
        searchTrace:
          $ref: "#/components/schemas/SearchTrace"
        diagnostics:
          $ref: "#/components/schemas/SourceSearchPipelineDiagnostics"
      required:
        - sources
    KeywordExpansionResult:
      type: object
      properties:
        normalized_topic:
          type: string
        domains:
          type: array
          items:
            type: string
        search_queries:
          type: array
          items:
            type: string
        english_queries:
          type: array
          items:
            type: string
        chinese_queries:
          type: array
          items:
            type: string
        preferred_source_types:
          type: array
          items:
            type: string
        avoid_source_types:
          type: array
          items:
            type: string
        reasoning_notes:
          type: array
          items:
            type: string
        fallback_used:
          type: boolean
        llm_status:
          type: string
          enum:
            - success
            - timeout
            - quota_exceeded
            - failed
            - skipped
      required:
        - normalized_topic
        - domains
        - search_queries
        - english_queries
        - chinese_queries
        - preferred_source_types
        - avoid_source_types
        - reasoning_notes
        - fallback_used
        - llm_status
    SearchIntentSummary:
      type: object
      properties:
        primaryConcepts:
          type: array
          items:
            type: string
        contextConcepts:
          type: array
          items:
            type: string
        outcomeConcepts:
          type: array
          items:
            type: string
        populationConcepts:
          type: array
          items:
            type: string
        lowWeightTerms:
          type: array
          items:
            type: string
        mustHaveTerms:
          type: array
          items:
            type: string
        plannerStatus:
          type: string
          enum:
            - llm
            - rule_fallback
            - skipped
            - failed
        fallbackUsed:
          type: boolean
      required:
        - primaryConcepts
        - contextConcepts
        - outcomeConcepts
        - populationConcepts
        - lowWeightTerms
        - mustHaveTerms
        - plannerStatus
        - fallbackUsed
    SearchIntentQuerySet:
      type: object
      properties:
        chinese:
          type: array
          items:
            type: string
        english:
          type: array
          items:
            type: string
        highPrecision:
          type: array
          items:
            type: string
        broad:
          type: array
          items:
            type: string
      required:
        - chinese
        - english
        - highPrecision
        - broad
    SearchIntentSourceSearchResult:
      type: object
      properties:
        ok:
          type: boolean
        topic:
          type: string
        workflowId:
          type: string
        topicHash:
          type: string
        queryPlanHash:
          type: string
        searchIntent:
          $ref: "#/components/schemas/SearchIntentSummary"
        queries:
          $ref: "#/components/schemas/SearchIntentQuerySet"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        provider_status:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
        warnings:
          type: array
          items:
            type: string
        planner:
          $ref: "#/components/schemas/SearchIntentPlan"
        relevance_debug:
          type: array
          items:
            $ref: "#/components/schemas/SearchRelevanceDebug"
        searchTrace:
          $ref: "#/components/schemas/SearchTrace"
        diagnostics:
          $ref: "#/components/schemas/SourceSearchPipelineDiagnostics"
        llm_status:
          type: string
          enum:
            - success
            - timeout
            - quota_exceeded
            - failed
            - skipped
        keyword_expansion:
          $ref: "#/components/schemas/KeywordExpansionResult"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
      required:
        - ok
        - topic
        - workflowId
        - topicHash
        - queryPlanHash
        - searchIntent
        - queries
        - results
        - sources
        - provider_status
        - warnings
        - planner
        - searchTrace
        - llm_status
        - keyword_expansion
        - groups
    SearchIntentPlan:
      type: object
      properties:
        normalizedTopic:
          type: string
        primaryConcepts:
          type: array
          items:
            type: string
        contextConcepts:
          type: array
          items:
            type: string
        outcomeConcepts:
          type: array
          items:
            type: string
        populationConcepts:
          type: array
          items:
            type: string
        lowWeightTerms:
          type: array
          items:
            type: string
        mustHaveTerms:
          type: array
          items:
            type: string
        shouldHaveTerms:
          type: array
          items:
            type: string
        penaltyTerms:
          type: array
          items:
            type: string
        negativeTerms:
          type: array
          items:
            type: string
        chineseQueries:
          type: array
          items:
            type: string
        englishQueries:
          type: array
          items:
            type: string
        reasoningNotes:
          type: array
          items:
            type: string
        plannerStatus:
          type: string
          enum:
            - llm
            - rule_fallback
            - skipped
            - failed
        fallbackUsed:
          type: boolean
      required:
        - normalizedTopic
        - primaryConcepts
        - contextConcepts
        - outcomeConcepts
        - populationConcepts
        - lowWeightTerms
        - mustHaveTerms
        - shouldHaveTerms
        - penaltyTerms
        - negativeTerms
        - chineseQueries
        - englishQueries
        - reasoningNotes
        - plannerStatus
        - fallbackUsed
    SearchRelevanceDebug:
      type: object
      properties:
        sourceId:
          type: string
        title:
          type: string
        score:
          type: number
        matchedPrimaryConcepts:
          type: array
          items:
            type: string
        matchedMustHaveTerms:
          type: array
          items:
            type: string
        matchedContextConcepts:
          type: array
          items:
            type: string
        matchedOutcomeConcepts:
          type: array
          items:
            type: string
        penalties:
          type: array
          items:
            type: string
      required:
        - sourceId
        - title
        - score
        - matchedPrimaryConcepts
        - matchedMustHaveTerms
        - matchedContextConcepts
        - matchedOutcomeConcepts
        - penalties
    SourceDecisionTrace:
      type: object
      properties:
        title:
          type: string
        provider:
          type: string
        url:
          type: string
          nullable: true
        relevanceScore:
          type: number
        authorityScore:
          type: number
        summaryUsabilityScore:
          type: number
        finalScore:
          type: number
        classification:
          type: string
        rejectReason:
          type: string
          nullable: true
        matchedTerms:
          type: array
          items:
            type: string
        driftTerms:
          type: array
          items:
            type: string
      required:
        - title
        - provider
        - url
        - relevanceScore
        - authorityScore
        - summaryUsabilityScore
        - finalScore
        - classification
        - rejectReason
        - matchedTerms
        - driftTerms
    SearchTrace:
      type: object
      properties:
        workflowId:
          type: string
        topic:
          type: string
        normalizedTopic:
          type: string
        topicHash:
          type: string
        queryPlanHash:
          type: string
        providerQueries:
          type: array
          items:
            type: string
        candidateCount:
          type: integer
        dedupedCount:
          type: integer
        acceptedCount:
          type: integer
        rejectedCount:
          type: integer
        sourceDecisions:
          type: array
          items:
            $ref: "#/components/schemas/SourceDecisionTrace"
      required:
        - workflowId
        - topic
        - normalizedTopic
        - topicHash
        - queryPlanHash
        - providerQueries
        - candidateCount
        - dedupedCount
        - acceptedCount
        - rejectedCount
        - sourceDecisions
    SourceSearchPipelineDiagnostics:
      type: object
      properties:
        retrieved_count:
          type: integer
        deduped_count:
          type: integer
        rejected_count:
          type: integer
        candidate_count:
          type: integer
        displayed_count:
          type: integer
        primary_candidate_count:
          type: integer
        provider_status:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              query:
                type: string
              ok:
                type: boolean
              result_count:
                type: integer
              error_type:
                type: string
                nullable: true
              error_message:
                type: string
                nullable: true
            required:
              - provider
              - query
              - ok
              - result_count
              - error_type
              - error_message
        warnings:
          type: array
          items:
            type: string
      required:
        - retrieved_count
        - deduped_count
        - rejected_count
        - candidate_count
        - displayed_count
        - primary_candidate_count
        - provider_status
        - warnings
    KeywordSourceGroup:
      type: object
      properties:
        ok:
          type: boolean
        provider:
          type: string
          enum:
            - OpenAlex
            - Crossref
            - Semantic Scholar
            - Official Source
            - Institutional Source
            - Authoritative Media
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        error_type:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
      required:
        - ok
        - provider
        - query
        - results
        - error_type
        - error_message
    KeywordSourceSearchResult:
      type: object
      properties:
        ok:
          type: boolean
        llm_status:
          type: string
          enum:
            - success
            - timeout
            - quota_exceeded
            - failed
            - skipped
        keyword_expansion:
          $ref: "#/components/schemas/KeywordExpansionResult"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/KeywordSourceGroup"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
      required:
        - ok
        - llm_status
        - keyword_expansion
        - groups
        - sources
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
